name: Build and publish Docker images

on:
  pull_request:
    paths:
      - 'apache/**'
      - 'fpm/**'
      - 'fpm-alpine/**'
      - 'frankenphp/**'
      - 'docker-entrypoint.sh'
      - '.github/workflows/publish-images.yml'

  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - 'apache/**'
      - 'fpm/**'
      - 'fpm-alpine/**'
      - 'frankenphp/**'
      - 'docker-entrypoint.sh'
      - '.github/workflows/publish-images.yml'

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/postfixadmin

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: apache
            context: ./apache
            suffix: -apache
            latest: 'true'

          - variant: fpm
            context: ./fpm
            suffix: -fpm
            latest: 'false'

          - variant: fpm-alpine
            context: ./fpm-alpine
            suffix: -fpm-alpine
            latest: 'false'

          - variant: frankenphp
            context: ./frankenphp
            suffix: -frankenphp
            latest: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |
            # type=raw,value=dev-${{ matrix.variant }},enable={{is_default_branch}}
            # type=raw,value=dev,enable=${{ matrix.variant == 'apache' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

            type=semver,pattern={{version}},suffix=-${{ matrix.variant }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.variant }}
            type=semver,pattern={{major}},suffix=-${{ matrix.variant }}

            type=semver,pattern={{version}},enable=${{ matrix.variant == 'apache' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.variant == 'apache' }}
            type=semver,pattern={{major}},enable=${{ matrix.variant == 'apache' }}
            type=raw,value=latest,enable=${{ matrix.variant == 'apache' && startsWith(github.ref, 'refs/tags/v') }}

          labels: |
            org.opencontainers.image.title=PostfixAdmin ${{ matrix.variant }}
            org.opencontainers.image.description=PostfixAdmin Docker image using the ${{ matrix.variant }} variant
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          provenance: mode=max
          sbom: true
